<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMT</title><link rel="stylesheet" href="/app.css"><script src="/login.js" defer></script></head>
<body><main style="margin:0;max-width:520px;margin-inline:auto"><img src="/logo.png" width="80" alt="DMT"><h1 data-key="auth.title"></h1><p data-key="auth.body"></p>
<form id="login" class="panel" style="padding:24px"><label><span data-key="setup.admin.username"></span><input id="username" name="username" autocomplete="username" required style="display:block;width:100%;margin:8px 0 20px"></label>
<label><span data-key="setup.admin.password"></span><input id="password" type="password" name="password" autocomplete="current-password" required maxlength="1024" style="display:block;width:100%;margin:8px 0 20px"></label>
<button class="button primary" data-key="auth.signIn"></button><p id="error" role="alert"></p></form></main></body></html>
